name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: markdownlint-cli2 (the rules in .markdownlint-cli2.jsonc)
        # Pinned, so a new release can't fail a pull request that changed nothing. The docs drifted
        # unnoticed in this repository while suveryn-docs and the handbook already ran it.
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"

  lint:
    name: Shellcheck + config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck all scripts
        # -S warning: fail on real problems (warning/error), not on info/style notes like SC1091
        # ("can't follow `. /etc/os-release`") — that's an intentional, unresolvable-by-shellcheck
        # source of a standard system file in image/prebuild.sh, not a bug.
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find . -name "*.sh" -not -path "./node_modules/*" -print0 | xargs -0 -r shellcheck -S warning

      - name: Validate pinned-version and lock files
        run: |
          for f in provision/versions.json \
                   keycloak/realm/realm-lock.json \
                   keycloak/theme/brand-lock.json; do
            python3 -m json.tool "$f" > /dev/null && echo "OK: $f"
          done

  tests:
    name: Every folder's tests (as a user, then as root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: What the tests need
        # The backup tests want a PostgreSQL with pgvector reachable on its socket, age and zstd; the reader
        # sandbox wants python3-seccomp; the network mode wants dnsmasq and ip. Without them those tests skip
        # themselves and say so, which is what happened on every machine that ran them by hand (handbook,
        # testing/regression-gap-analysis.md: the appliance's findings were in exactly these parts). The console's
        # screen tests want python3-pyte (a terminal to draw on) and skipped here without it. The stick's
        # partitions and the installer's log on a real FAT partition want sfdisk, mkfs.vfat and mtools (#144).
        run: |
          sudo apt-get update -qq
          pgvector=$(apt-cache search --names-only '^postgresql-[0-9]+-pgvector$' | awk '{print $1}' | sort -V | tail -1)
          sudo apt-get install -y -qq python3-pytest python3-yaml python3-seccomp python3-pyte age zstd dnsmasq iproute2 \
            fdisk dosfstools mtools \
                                      postgresql postgresql-contrib "$pgvector"
          sudo systemctl start postgresql
          sudo -u postgres psql -c "select version()"

      - name: suveryn-core at the pinned commit
        # The web setup says suveryn-core's messages and keeps no list of its own (suveryn-tracker#141), so its
        # tests need the core the appliance pins: the same repository and commit provisioning installs
        # (provision/versions.json). Until that pin is at a core with the setup's messages, those tests skip
        # and say so.
        run: |
          repo=$(python3 -c "import json; print(json.load(open('provision/versions.json'))['suveryn_core']['repo'])")
          commit=$(python3 -c "import json; print(json.load(open('provision/versions.json'))['suveryn_core']['commit'])")
          git clone --quiet "$repo" "$HOME/suveryn-core"
          git -C "$HOME/suveryn-core" checkout --quiet "$commit"
          echo "suveryn-core at $(git -C "$HOME/suveryn-core" rev-parse --short HEAD)"
          echo "SUVERYN_CORE=$HOME/suveryn-core" >> "$GITHUB_ENV"

      - name: As a user (what a developer runs)
        run: python3 -m pytest */tests image/mkosi/test -q -p no:cacheprovider -rs

      - name: As root, with PostgreSQL (the sandbox, the network mode, the backups and their restore)
        # sudo drops the environment (-E isn't allowed here), so the variables go through env. The sandbox
        # tests run the reader as nobody and suveryn-reader, who must be able to reach the checkout under
        # /home/runner, which other users can't traverse by default.
        run: |
          chmod o+x "$HOME" "$HOME/work"
          sudo env SUVERYN_CORE="$SUVERYN_CORE" SUVERYN_TEST_PG_HOST=/var/run/postgresql SUVERYN_TEST_PG_PORT=5432 \
            python3 -m pytest */tests image/mkosi/test -q -p no:cacheprovider -rs

  executable-bits:
    name: Scripts keep their executable bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every tracked file that starts with a shebang is executable
        # suveryn-provision was once committed without it (VM regression e0f2e26, finding 18).
        run: |
          status=0
          while IFS= read -r f; do
            if [ "$(head -c 2 "$f" 2>/dev/null)" = "#!" ] && [ ! -x "$f" ]; then
              echo "::error file=$f::starts with #! but isn't executable (git update-index --chmod=+x $f)"
              status=1
            fi
          done < <(git ls-files | grep -v '\.nft$')   # inbound.nft is read by "nft -f", never run
          exit $status

  mkosi-config-check:
    name: mkosi config sanity check (no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mkosi
        # mkosi isn't published on PyPI (pipx install mkosi fails with "No matching distribution");
        # install it straight from its git repo, as the project's own README does.
        run: pipx install git+https://github.com/systemd/mkosi.git
      - name: Summarize config (fails on invalid config, builds nothing)
        run: mkosi --directory image/mkosi summary

  # Full mkosi/Packer image builds are deliberately NOT run on every push:
  # they're slow, need near-bare-metal resources, and touch dm-verity/TPM/
  # LUKS setup that isn't meaningful to exercise on a generic GitHub-hosted
  # runner. Trigger by hand (workflow_dispatch) or wire to release tags once
  # the appliance work is far enough along to need CI coverage for it.
  build-image:
    name: Full image build (manual trigger only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Placeholder
        run: echo "Wire up the real mkosi/Packer build here when it's worth the time/cost."
