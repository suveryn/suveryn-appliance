# Keycloak's underlying Quarkus settings that keycloak.conf has no option for. suveryn-provision copies it to
# Keycloak's conf/quarkus.properties beside keycloak.conf; runtime settings only, so no kc.sh build.

# A pooled database connection is checked before it is used. Without this, after PostgreSQL restarted (a
# backup restored, an update) Keycloak's pool held dead connections and the first request after failed:
# the person signing in got Keycloak's "internal server error" page, and only then did the pool drop the
# dead connection (suveryn-core's end-to-end lifecycle scenario, 2 November 2026: 3 of 4 trials; none with
# this). Agroal's background validation runs every two minutes, which is why it was not always.
quarkus.datasource.jdbc.validate-on-borrow=true
