# Sūveryn login theme. Extends Keycloak's own keycloak.v2 login theme (Keycloak 26.8); only the page
# frame (template.ftl), one line under the password field (login.ftl), styles and messages differ.
parent=keycloak.v2
import=common/keycloak

# Product UI is light only (dark is reserved for the marketing site).
darkMode=false

styles=css/styles.css css/suveryn.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

# Password show/hide toggle: Lucide eye / eye-off (see suveryn.css) instead of Font Awesome.
kcFormPasswordVisibilityIconShow=suv-icon suv-icon-eye
kcFormPasswordVisibilityIconHide=suv-icon suv-icon-eye-off

# Notice icons: Lucide instead of Font Awesome; colours in suveryn.css (no amber, red, blue or green).
kcFeedbackErrorIcon=suv-icon suv-icon-alert-circle
kcFeedbackWarningIcon=suv-icon suv-icon-alert-triangle
kcFeedbackSuccessIcon=suv-icon suv-icon-check-circle
kcFeedbackInfoIcon=suv-icon suv-icon-info
kcInputErrorIconClass=suv-icon suv-icon-alert-circle

# The "Air-gapped" badge states a fact, so it shows only when the installation's network mode is
# air-gapped. Keycloak reads the mode from its environment: its unit loads /etc/suveryn/network-mode.env
# (network-mode/README.md). Missing or anything else: "unknown", and the badge stays off.
suverynNetworkMode=${env.SUVERYN_NETWORK_MODE:unknown}

locales=en,nl,fr
