# Sūveryn login theme, Dutch. Sūveryn addresses people formally ("u", "uw"), as Keycloak's own
# Dutch strings do, so only the Sūveryn strings are added here. The tagline and the "Air-gapped"
# badge stay in English, as on the Dutch website.
suverynTagline=AI for work that can''t leave the premises.
suverynAirGapped=Air-gapped
suverynDirectoryHint=Werkt ook met het bestaande directory-account van uw kantoor.
loginAccountTitle=Inloggen
doLogIn=Inloggen

# ---- Spelling errors in Keycloak's own Dutch strings, corrected (still formal)
configureTotpMessage=U moet de mobiele authenticator configureren om uw account te activeren.
cookieNotFoundMessage=Het cookie om opnieuw in te loggen is niet gevonden. Misschien is het verlopen of verwijderd, of zijn cookies uitgeschakeld in uw browser. Schakel cookies in dat geval in. Klik op Terug naar de applicatie om opnieuw in te loggen.

# ---- The link on Keycloak's error pages, named as the messages above name it ("Terug naar de applicatie")
backToApplication=« Terug naar de applicatie
identityProviderLinkSuccess=U hebt bevestigd dat uw account gekoppeld wordt aan {0}-account {1}. Keer terug naar uw oorspronkelijke browser en ga daar verder met inloggen.
