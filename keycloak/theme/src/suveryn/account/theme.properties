# Sūveryn account console theme. Extends Keycloak's own keycloak.v3 account console (Keycloak 26.8),
# a React app, through its supported settings only: logo, favicon, title, a stylesheet and messages.
parent=keycloak.v3
darkMode=false
title=Sūveryn account
logo=/suveryn-logotype.svg
favIcon=/favicon.svg
styles=css/account.css
locales=en,nl,fr
