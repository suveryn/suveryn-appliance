# Sūveryn account console, Dutch. Keycloak 26.8 supplies the Dutch strings; Sūveryn addresses people
# formally ("u", "uw"), so the few informal ones are rewritten here, and the strings Keycloak hasn't
# translated yet are added (they would otherwise show in English). suveryn-tracker#9.

# ---- Keycloak's informal strings ("je"), made formal
verifiableCredentialsDescription=Selecteer de gegevens om te importeren in uw portefeuille.
webauthn-help-text=Log in met uw passkey.
recovery-codes-generate-new-codes=Genereer nieuwe codes om de toegang tot uw account te waarborgen
organizationDescription=Bekijk de organisaties waarvan u lid bent
emptyUserOrganizationsInstructions=U bent nog geen lid van een organisatie.

# ---- Not yet translated by Keycloak
endApplicationSessionMessage=Hiermee beëindigt u uw sessies met {{name}}, ook eventuele offline sessies. Omdat uw browser nog ingelogd is, kan de applicatie u opnieuw laten inloggen zonder naar uw inloggegevens te vragen wanneer u ze weer opent.
pageNotFound=De gevraagde pagina is niet gevonden.
