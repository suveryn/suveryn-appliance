# The test system: the same layout and rules as the appliance, small enough to build and boot in a
# virtual machine without hardware acceleration (test/run-vm-tests). No GPU stack, no sūveryn services.

[Output]
ImageId=suveryn-test

[Content]
Packages=linux-image-virtual
KernelCommandLine=console=ttyS0
ExtraTrees=extra
           ../../target/test:/usr/lib/suveryn/repart.d
           # the test bundle keys, made by test/make-test-keys (never committed)
           ../../test/keys/public

[Output]
# Its own partition sizes: the same partitions, minimised.
RepartDirectories=
RepartDirectories=mkosi.repart
