# The test system has no sūveryn services and no GPU: a stand-in for suveryn-provision first-boot
# (the same steps, the real TLS and nginx site; failing once at Keycloak, for Try again) and for the
# outgoing-traffic check. run-vm-tests drives the screens against them.
[Service]
Environment=SUVERYN_PROVISION=/opt/suveryn/appliance/setup/tests/stand_in_provision.py
Environment=SUVERYN_NETWORK_MODE_TOOL=/usr/lib/suveryn-test/network-mode-check
Environment=STAND_IN_FAIL_AT=Keycloak
Environment=SUVERYN_PORTAL_KEYS=/usr/lib/suveryn-test/portal-keys
