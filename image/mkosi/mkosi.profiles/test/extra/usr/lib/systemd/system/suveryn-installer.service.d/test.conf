# The test system: the installer runs on the serial console (run-vm-tests drives it there), and only
# when the test asks for it with the credential suveryn.installer-on-serial; otherwise the self-test
# has the console.
[Unit]
ConditionCredential=suveryn.installer-on-serial
Conflicts=serial-getty@ttyS0.service
Before=serial-getty@ttyS0.service

[Service]
TTYPath=/dev/ttyS0
Environment=COLUMNS=100 LINES=30 SUVERYN_INSTALLER_ALLOW_NO_GPU=1
