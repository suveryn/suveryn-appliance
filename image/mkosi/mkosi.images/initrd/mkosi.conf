# The initrd: mkosi's own, plus what opens the encrypted data partition (#34) or, on the installer stick,
# puts /var in memory (#37): the TPM libraries
# systemd loads and suveryn-boot-mode.service. Its output is the main image's initrd (mkosi.conf: Initrds=).

[Include]
Include=mkosi-initrd

[Output]
Format=cpio
Output=initrd

[Content]
# dlopen'ed by systemd-cryptsetup to unlock with the TPM.
Packages=
        libtss2-esys-3.0.2-0t64
        libtss2-rc0t64
        libtss2-mu-4.0.1-0t64
        libtss2-tcti-device0t64
        # the unlock screen (C8b, unlock-screen): the brand's colours and a font with ū
        kbd
        console-setup-linux
ExtraTrees=extra
