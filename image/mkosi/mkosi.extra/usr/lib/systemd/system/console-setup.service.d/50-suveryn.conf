# The console's font and keyboard layout, at every start (#37). The package's script saves its
# settings into /etc/console-setup whenever /etc/default/keyboard is newer, and on the appliance /etc
# is read-only and the keyboard is chosen at installation (/etc/default/keyboard links to the data
# partition), so it failed and the chosen layout never reached the console. setupcon applies the
# font and layout directly instead, saving nothing.
[Unit]
After=systemd-tmpfiles-setup.service

[Service]
ExecStart=
ExecStart=/bin/setupcon --force
