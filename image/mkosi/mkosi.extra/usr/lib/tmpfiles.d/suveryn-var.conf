# The office's part of /etc, on the data partition (docs/design/appliance-architecture.md, "Where the
# office's settings live"). /etc links here; these create the targets on a fresh data partition.
d /var/lib/suveryn          0755 root root -
d /var/lib/suveryn/etc      0755 root root -
d /var/lib/suveryn/host     0755 root root -
d /var/lib/suveryn/network  0755 root root -
f /var/lib/suveryn/host/hosts 0644 root root - 127.0.0.1 localhost\n::1 localhost ip6-localhost ip6-loopback\n
