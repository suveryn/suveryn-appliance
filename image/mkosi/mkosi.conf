# The sūveryn appliance's read-only system (docs/design/appliance-architecture.md; tracker #39).
#   cd image/mkosi && mkosi -f build                    # the appliance
#   cd image/mkosi && mkosi -f --profile test build     # the small test system (test/run-vm-tests)
# mkosi 25.3 (upstream, pinned: Ubuntu 24.04's own mkosi 20.2 can't build a noble initrd).

[Config]
# Our own initrd, built first (mkosi.images/initrd): it opens the encrypted data partition.
Dependencies=initrd

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=universe,restricted

[Output]
Format=disk
ImageId=suveryn
ImageVersion=0.0.0
OutputDirectory=mkosi.output

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
Initrds=%O/initrd
# The kernel's command line is in the boot file, with the root hash mkosi adds (roothash=).
KernelCommandLine=console=tty1
# No /usr/share/doc. Licence texts that must ship anyway (NVIDIA's driver) are in mkosi.extra under
# /usr/share/suveryn/licences, checked in mkosi.postinst.chroot.
WithDocs=no
Packages=
        systemd
        systemd-boot
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        kmod
        e2fsprogs
        dosfstools
        cryptsetup-bin
        # device-mapper's udev rules: without them libdevmapper waits forever for udev (installer, #34)
        dmsetup
        libtss2-esys-3.0.2-0t64
        libtss2-rc0t64
        libtss2-mu-4.0.1-0t64
        libtss2-tcti-device0t64
        nftables
        dnsmasq-base
        iproute2
        python3
        # the identity's key and signatures (#35)
        openssl
        # the installer's boot entry for the installed disk (#37)
        efibootmgr
        # the console: keyboard layouts (from XKB), the Terminus font with ū, its colours (#37)
        kbd
        console-setup-linux
        keyboard-configuration
        # the registration QR code on the console (C8)
        qrencode
        ca-certificates
        tzdata
        less
