# The sūveryn services on the read-only system (tracker #47): what suveryn-provision image installed on
# an ordinary Ubuntu, now part of the image. The appliance only: the test system (test profile) has no
# GPU and runs none of them. Stage 1: the runtime packages, the users, the folders on the data
# partition, the reader's sudo rule, and PostgreSQL's cluster made at first boot (mkosi.postinst.chroot).
[Match]
Profiles=!test

[Content]
Packages=
        # the databases, with pgvector (suveryn and keycloak)
        postgresql-16
        postgresql-16-pgvector
        # Keycloak's Java
        openjdk-21-jre-headless
        # reading documents: OCR (Dutch, French, English), PDF tools, and the reader sandbox's seccomp
        tesseract-ocr
        tesseract-ocr-nld
        tesseract-ocr-fra
        tesseract-ocr-eng
        ghostscript
        poppler-utils
        python3-seccomp
        # the gateway starts the reader as suveryn-reader
        sudo
        # libraries suveryn-core's Python packages load (OpenCV in Docling)
        libgl1
        libsm6
        libice6
ExtraTrees=services
