# The sūveryn services on the read-only system (tracker #47): what suveryn-provision image installed on
# an ordinary Ubuntu, now part of the image. The appliance only: the test system (test profile) has no
# GPU and runs none of them. Stage 1: the runtime packages, the users, the folders on the data
# partition, the reader's sudo rule, and PostgreSQL's cluster made at first boot (mkosi.postinst.chroot).
# Stage 3: NVIDIA's driver. Stage 2: sūveryn itself, from prebuilt/ (made on a Pod by prebuild-services: suveryn-core compiled
# with its embedding and Docling models, llama-server and its CUDA libraries, Keycloak, the chat UI),
# the units, the reader sandbox and the network mode's tool. The build stops without prebuilt/.
[Match]
Profiles=!test

[Content]
Packages=
        # the databases, with pgvector (suveryn and keycloak)
        postgresql-16
        postgresql-16-pgvector
        # Keycloak's Java
        openjdk-21-jre-headless
        # reading documents: OCR (Dutch, French, English), PDF tools, and the reader sandbox's seccomp
        tesseract-ocr
        tesseract-ocr-nld
        tesseract-ocr-fra
        tesseract-ocr-eng
        ghostscript
        poppler-utils
        python3-seccomp
        # the gateway starts the reader as suveryn-reader
        sudo
        # NVIDIA's driver (stage 3), Ubuntu's: the open kernel modules for linux-generic, built and signed
        # by Canonical, so they load with Secure Boot on (#45); the CUDA driver library and nvidia-smi.
        # Its licence text: /usr/share/suveryn/licences (#49; the build stops without it).
        linux-modules-nvidia-580-open-generic
        libnvidia-compute-580
        nvidia-utils-580
        # libraries suveryn-core's Python packages load (OpenCV in Docling)
        libgl1
        libsm6
        libice6
        libglib2.0-0t64
        libxext6
        libxrender1
        libxcb1
ExtraTrees=services
           prebuilt
           ../../provision/systemd:/usr/lib/systemd/system
           ../../reader-sandbox:/opt/suveryn/appliance/reader-sandbox
           # check-prebuilt reads the theme's pin (brand-lock.json)
           ../../keycloak/theme:/opt/suveryn/appliance/keycloak/theme
