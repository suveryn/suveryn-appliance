# The web setup (tracker #37) and the office's site: nginx, and the parts of this repository they run
# from /opt/suveryn/appliance (setup/, and what it uses: support manifests, provisioning's TLS and
# nginx steps, the site template, the network mode, the realm builder). The units, the setup user
# and nginx's place on the data partition: mkosi.postinst.chroot. Both profiles.

[Content]
Packages=
        nginx
ExtraTrees=
        ../../setup:/opt/suveryn/appliance/setup
        ../../support:/opt/suveryn/appliance/support
        ../../provision:/opt/suveryn/appliance/provision
        ../../reverse-proxy:/opt/suveryn/appliance/reverse-proxy
        ../../network-mode:/opt/suveryn/appliance/network-mode
        ../../keycloak/realm:/opt/suveryn/appliance/keycloak/realm
