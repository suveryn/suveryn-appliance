# The appliance (any build without the test profile): the kernel with the drivers real hardware
# needs, and its firmware.
[Match]
Profiles=!test

[Content]
Packages=
        linux-generic
        linux-firmware

# The initrd only needs to reach the disk and open it: mkosi's default selection (NVMe, SATA, USB
# storage, device-mapper and verity, EROFS, ext4, FAT, virtio) plus the controllers servers often
# have. Everything else, and all firmware, stays in the system itself: with every module and all of
# linux-firmware the boot file was 483 MB, and the EFI partition holds one per slot.
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
        /uas.ko
        /xhci-pci.ko
        /vmd.ko
        /megaraid_sas.ko
        /mpt3sas.ko
        /smartpqi.ko
        /hpsa.ko
        /tpm_crb.ko
        /tpm_tis.ko

# The disk's partition definitions for the installer's disk step (install-disk).
ExtraTrees=target/appliance:/usr/lib/suveryn/repart.d
