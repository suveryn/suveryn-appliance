# The services' folders on the data partition, made on a fresh one at every start if missing
# (suveryn-provision's users() and reader_sandbox() on an ordinary Ubuntu).
d /var/lib/suveryn/work             0700 suveryn        suveryn        -
# uploads waiting for the reader: the gateway writes, the reader's group reads (setgid)
d /var/lib/suveryn/inbox            2750 suveryn        suveryn-reader -
d /var/lib/suveryn/reader           0700 suveryn-reader suveryn-reader -
d /var/lib/suveryn/downloads        0755 root           root           -
d /var/log/suveryn                  0755 root           root           -
# PostgreSQL's configuration, made with its cluster at first boot (/etc/postgresql links here)
d /var/lib/suveryn/postgresql-etc   0755 root           root           -
# Keycloak's own writable folder (/opt/keycloak/data links here: the rest of Keycloak is read-only)
d /var/lib/suveryn/keycloak         0700 keycloak       keycloak       -
