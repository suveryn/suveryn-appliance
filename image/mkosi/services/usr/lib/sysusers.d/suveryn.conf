# The services' users, made when the image is built (/etc/passwd can't change on the appliance).
# suveryn-provision's users() and reader-sandbox/provision-reader.sh make the same on an ordinary Ubuntu.
u suveryn        - "sūveryn gateway"       /nonexistent /usr/sbin/nologin
u suveryn-llm    - "sūveryn model server"  /nonexistent /usr/sbin/nologin
u keycloak       - "Keycloak"              /opt/keycloak /usr/sbin/nologin
u suveryn-dns    - "sūveryn resolver"      /nonexistent /usr/sbin/nologin
u suveryn-reader - "sūveryn PDF reader"    /nonexistent /usr/sbin/nologin
# The gateway hands uploads to the reader through the inbox (group suveryn-reader).
m suveryn suveryn-reader
