# The data partition: /var, the rest of the disk. Unencrypted in this step; LUKS2 with the TPM is #34.
[Partition]
Type=linux-generic
Label=suveryn-data
Format=ext4
# The machine-id file, empty: mounted over /etc/machine-id in the initrd, filled by systemd on the
# first boot. Copied from the system the installer runs (repart --copy-source).
MakeDirectories=/lib/suveryn/host
CopyFiles=/usr/lib/suveryn/empty-machine-id:/lib/suveryn/host/machine-id
SizeMinBytes=1G
