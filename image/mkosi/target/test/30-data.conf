# The data partition: /var, the rest of the disk. LUKS2 (#34): made with a temporary key that
# install-disk replaces by the TPM and a recovery key.
[Partition]
Type=linux-generic
Label=suveryn-data
Format=ext4
Encrypt=key-file
# The machine-id file, empty: mounted over /etc/machine-id in the initrd, filled by systemd on the
# first boot.
MakeDirectories=/lib/suveryn/host
CopyFiles=/usr/lib/suveryn/empty-machine-id:/lib/suveryn/host/machine-id
SizeMinBytes=1G
