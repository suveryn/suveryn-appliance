# System slot A, copied block for block from the system the installer runs (the stick's slot A).
[Partition]
Type=root
Label=%M_%A
CopyBlocks=auto
# Exactly the copied size: free space goes to the data partition, not here.
Weight=0
# systemd finds slot A by the UUIDs derived from the root hash (install-disk fills them in).
UUID=@ROOT_UUID@
