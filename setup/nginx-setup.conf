# sūveryn web setup: the setup page and its API, while setup is open (suveryn-tracker#37).
# suveryn-setup prepare writes this to /etc/suveryn/nginx-setup.conf; the site includes it
# (suveryn-setup's own site before provisioning, the real site after) and suveryn-setup deletes it
# when setup closes. From the office's own network only (private and loopback addresses), as the
# design asks: "reachable on the local network only until setup finishes".

# The setup page instead of the chat at /. Its files are in the chat UI's build (/opt/suveryn/ui).
location = / {
    include /etc/nginx/snippets/suveryn-headers.conf;
    include /etc/nginx/snippets/suveryn-csp.conf;
    add_header Cache-Control "no-cache" always;
    allow 127.0.0.0/8;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 169.254.0.0/16;
    allow fc00::/7;
    allow fe80::/10;
    deny all;
    try_files /setup.html =404;
}

# The setup API: suveryn-setup serve, unprivileged, on the loopback address.
location /setup/v1/ {
    include /etc/nginx/snippets/suveryn-headers.conf;
    include /etc/nginx/snippets/suveryn-csp.conf;
    allow 127.0.0.0/8;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 169.254.0.0/16;
    allow fc00::/7;
    allow fe80::/10;
    deny all;
    client_max_body_size 300k;            # three PEM files of 64 KB each, as JSON; a manifest is far smaller
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_read_timeout 60s;
}
