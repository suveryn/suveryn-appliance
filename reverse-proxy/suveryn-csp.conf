# The chat UI's Content-Security-Policy (with suveryn-headers.conf). The built UI has no inline
# scripts or styles, no data: URLs and no eval, and loads nothing from elsewhere: fonts, icons and
# the Word/Excel libraries are its own files (suveryn-core packages/chat-ui). So everything is
# 'self', without 'unsafe-inline'. React's style props are set through the DOM, which style-src
# allows. Not used for Keycloak's pages, which send their own CSP.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
