# Security headers for every response from sūveryn's own origin. Included in each location that
# sets any header of its own, because nginx drops the server's add_header lines in a location that
# has one (the classic way to lose them silently). `always`: also on 4xx/5xx answers.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
